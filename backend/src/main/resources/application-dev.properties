spring.application.name=fab-legis

# Tomcat
server.port=8081

# Swagger
springdoc.api-docs.path=/v1/fab-legis-api
#springdoc.swagger-ui.tagsSorter=method
#springdoc.swagger-ui.tags-sorter=method
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.default-models-expand-depth=-1

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fab-legis-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# MongoDB
#spring.data.mongodb.uri=mongodb://localhost:27017/fab-legisDB
#spring.data.mongodb.auto-index-creation=true
#spring.data.mongodb.database=fab-legisDB

# SpringDataJPA -- dialect não é mais declarado explicitamente: Hibernate 7
# autodetecta pelo driver JDBC (e avisa como deprecated se declarado à toa).
# O Flyway é a fonte única de verdade do schema (ver db/migration); o Hibernate só
# valida se as entidades batem com o schema aplicado, nunca altera a estrutura.
spring.jpa.hibernate.ddl-auto=validate

# Jackson — datas como ISO string, não timestamp numérico. Jackson 3 (Spring Boot
# 4) já move isso de SerializationFeature pra DateTimeFeature, com prefixo de
# propriedade diferente -- e já DEFAULT false (Jackson 2 default era true), mas
# mantemos explícito pra não depender de um default que pode mudar de novo.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# FlyWay
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Docker Compose (desabilitado — gerenciado pelo docker-compose.yml raiz)
spring.docker.compose.enabled=false

# CORS
cors.allowed.origins=http://localhost:5173,http://localhost:4200,http://localhost:3000,http://localhost:80

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Open session in View
#spring.jpa.open-in-view=true

# URL base do frontend (usada pelo gerador de PDF para resolver imagens estáticas)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# MinIO — armazenamento de imagens on-premise
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:fab-legis-imagens}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
# Fixa a regiao no client (em vez de deixar o SDK descobrir via GetBucketLocation)
# -- essencial pro client "publico" de MinioConfig, que assina URLs com o endpoint
# publico mas roda dentro do backend, sem conseguir alcanca-lo pela rede Docker.
minio.region=${MINIO_REGION:us-east-1}

# Authorization Server embutido (OAuth2 Authorization Code + PKCE) -- ver
# AuthorizationServerConfig. issuer precisa ser o endereço que o NAVEGADOR usa
# (bate com o claim "iss" do token, checado pelo resource server e pelo
# collab); redirect-uri é a rota de callback da SPA; frontend-login-url é pra
# onde o Authorization Server manda usuários não-autenticados.
app.oauth2.issuer=${APP_OAUTH2_ISSUER:http://127.0.0.1:8081}
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://127.0.0.1:5173/callback}
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:http://127.0.0.1:5173/login}

# Usuário administrador padrão, criado por DataSeeder no primeiro boot (só se
# nenhum usuário com login ainda existir). Troque a senha assim que possível.
app.admin.cpf=${APP_ADMIN_CPF:11144477735}
app.admin.senha=${APP_ADMIN_SENHA:Admin@123}
app.admin.nome=${APP_ADMIN_NOME:Administrador}

# Notificações e presença de edição (ver NotificacaoController/DocumentoController)
# ficam em processamento ASSÍNCRONO depois do dispatch inicial (SseEmitter) --
# sem isto, o filtro de autorização do Spring Security roda de novo no
# redispatch assíncrono (quando a conexão SSE fecha/expira), sem
# Authentication disponível naquele momento, e lança AuthorizationDeniedException
# depois que a resposta já foi commitada (os headers do SSE já saíram, gerando
# "Unable to handle the Spring Security Exception because the response is
# already committed" nos logs). A autorização já foi checada no dispatch
# REQUEST inicial; não precisa (nem pode, nesse ponto) ser reavaliada no ASYNC.
spring.security.filter.dispatcher-types=REQUEST,ERROR