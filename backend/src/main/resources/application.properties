spring.application.name=fab-legis

spring.profiles.active=dev

# Desabilita a integracao HAL do springdoc (incompativel com Spring Boot 3.5.0 — HateoasProperties.getUseHalAsDefaultJsonMediaType removido)
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration

# Actuator/Micrometer -- só os 4 endpoints abaixo ficam acessíveis via HTTP
# (nunca "*": /actuator/env, /actuator/beans, /actuator/heapdump etc. vazam
# detalhe interno demais pra ficar exposto, mesmo atrás de autenticação).
# /health é o único liberado sem login (ver SecurityConfig) -- é o que o
# healthcheck do docker-compose.yml usa, e não tem como mandar um token ali.
# show-details=never (padrão) garante que, mesmo sem token, a resposta seja só
# {"status":"UP"}, nunca o detalhe de cada dependência (banco, disco etc.).
# Geração de PDF (Apache FOP): quantas renderizações simultâneas por instância e quanto um pedido
# espera por uma vaga antes de receber 503 (ver LimitadorGeracaoPdf e docs/exportacao-pdf.md).
app.pdf.max-concorrentes=${APP_PDF_MAX_CONCORRENTES:2}
app.pdf.espera-maxima-segundos=${APP_PDF_ESPERA_MAXIMA_SEGUNDOS:30}

# Cache, no MinIO, do PDF/HTML de documentos em tramitação (DocumentoRenderCacheService) --
# quantos dias um objeto em cache/ fica até o MinIO expirá-lo automaticamente.
app.pdf.cache.ttl-dias=${APP_PDF_CACHE_TTL_DIAS:2}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Documento tem 6 relacoes @ManyToOne EAGER (autor, om, especieNormativa, assuntoBasico,
# revisorAtribuido, publicadorAtribuido) -- isso so gera JOIN automatico em busca por id; nas
# listagens paginadas (findAll(Specification, Pageable), usado pelo hub e pelos modulos) o
# Hibernate dispara uma SELECT extra por associacao, por linha da pagina (N+1). Isso agrupa essas
# selects extras em poucas "SELECT ... WHERE id IN (...)" em vez de uma por linha.
spring.jpa.properties.hibernate.default_batch_fetch_size=25