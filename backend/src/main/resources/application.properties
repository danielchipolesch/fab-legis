spring.application.name=fab-legis

spring.profiles.active=dev

# Desabilita a integracao HAL do springdoc (incompativel com Spring Boot 3.5.0 — HateoasProperties.getUseHalAsDefaultJsonMediaType removido)
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration

# Actuator/Micrometer -- só os 4 endpoints abaixo ficam acessíveis via HTTP
# (nunca "*": /actuator/env, /actuator/beans, /actuator/heapdump etc. vazam
# detalhe interno demais pra ficar exposto, mesmo atrás de autenticação).
# /health é o único liberado sem login (ver SecurityConfig) -- é o que o
# healthcheck do docker-compose.yml usa, e não tem como mandar um token ali.
# show-details=never (padrão) garante que, mesmo sem token, a resposta seja só
# {"status":"UP"}, nunca o detalhe de cada dependência (banco, disco etc.).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never