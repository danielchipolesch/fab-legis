# Configuração ÚNICA da aplicação, igual em desenvolvimento e em produção: tudo que varia por ambiente vem de variável de
# ambiente (o .env da raiz, via docker-compose.yml), com o padrão de desenvolvimento como valor padrão. Não há perfis
# (dev/prod) -- ver "Instalação em produção" no README.md para os valores de cada ambiente.

spring.application.name=fab-legis

# Tomcat
server.port=8081

# Swagger / OpenAPI -- o contrato da API (endpoints e DTOs); chamar um endpoint exige token como em qualquer outro.
# APP_SWAGGER_ENABLED=false desliga a UI e o JSON, se um ambiente preferir não publicar o contrato.
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v1/fab-legis-api
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.default-models-expand-depth=-1


# Desabilita a integracao HAL do springdoc (incompativel com Spring Boot 3.5.0 — HateoasProperties.getUseHalAsDefaultJsonMediaType removido)
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration

# Actuator/Micrometer -- só os 4 endpoints abaixo ficam acessíveis via HTTP
# (nunca "*": /actuator/env, /actuator/beans, /actuator/heapdump etc. vazam
# detalhe interno demais pra ficar exposto, mesmo atrás de autenticação).
# /health é o único liberado sem login (ver SecurityConfig) -- é o que o
# healthcheck do docker-compose.yml usa, e não tem como mandar um token ali.
# show-details=never (padrão) garante que, mesmo sem token, a resposta seja só
# {"status":"UP"}, nunca o detalhe de cada dependência (banco, disco etc.).
# Geração de PDF (Apache FOP): quantas renderizações simultâneas por instância e quanto um pedido
# espera por uma vaga antes de receber 503 (ver LimitadorGeracaoPdf e docs/exportacao-pdf.md).
app.pdf.max-concorrentes=${APP_PDF_MAX_CONCORRENTES:2}
app.pdf.espera-maxima-segundos=${APP_PDF_ESPERA_MAXIMA_SEGUNDOS:30}

# Cache, no MinIO, do PDF/HTML de documentos em tramitação (DocumentoRenderCacheService) --
# quantos dias um objeto em cache/ fica até o MinIO expirá-lo automaticamente.
app.pdf.cache.ttl-dias=${APP_PDF_CACHE_TTL_DIAS:2}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Documento tem 6 relacoes @ManyToOne EAGER (autor, om, especieNormativa, assuntoBasico,
# revisorAtribuido, publicadorAtribuido) -- isso so gera JOIN automatico em busca por id; nas
# listagens paginadas (findAll(Specification, Pageable), usado pelo hub e pelos modulos) o
# Hibernate dispara uma SELECT extra por associacao, por linha da pagina (N+1). Isso agrupa essas
# selects extras em poucas "SELECT ... WHERE id IN (...)" em vez de uma por linha.
spring.jpa.properties.hibernate.default_batch_fetch_size=25
# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fab-legis-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SpringDataJPA -- dialect não é mais declarado explicitamente: Hibernate 7
# autodetecta pelo driver JDBC (e avisa como deprecated se declarado à toa).
# O Flyway é a fonte única de verdade do schema (ver db/migration); o Hibernate só
# valida se as entidades batem com o schema aplicado, nunca altera a estrutura.
spring.jpa.hibernate.ddl-auto=validate

# Jackson — datas como ISO string, não timestamp numérico. Jackson 3 (Spring Boot
# 4) já move isso de SerializationFeature pra DateTimeFeature, com prefixo de
# propriedade diferente -- e já DEFAULT false (Jackson 2 default era true), mas
# mantemos explícito pra não depender de um default que pode mudar de novo.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# FlyWay
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Docker Compose (desabilitado — gerenciado pelo docker-compose.yml raiz)
spring.docker.compose.enabled=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# URL base do frontend (usada pelo gerador de PDF para resolver imagens estáticas)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# MinIO — armazenamento de imagens on-premise
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:fab-legis-imagens}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
# Fixa a regiao no client (em vez de deixar o SDK descobrir via GetBucketLocation)
# -- essencial pro client "publico" de MinioConfig, que assina URLs com o endpoint
# publico mas roda dentro do backend, sem conseguir alcanca-lo pela rede Docker.
minio.region=${MINIO_REGION:us-east-1}

# Authorization Server embutido (OAuth2 Authorization Code + PKCE) -- ver
# AuthorizationServerConfig. issuer precisa ser o endereço que o NAVEGADOR usa
# (bate com o claim "iss" do token, checado pelo resource server e pelo
# collab); redirect-uri é a rota de callback da SPA; frontend-login-url é pra
# onde o Authorization Server manda usuários não-autenticados.
app.oauth2.issuer=${APP_OAUTH2_ISSUER:http://127.0.0.1:8081}
app.oauth2.redirect-uri=${APP_OAUTH2_REDIRECT_URI:http://127.0.0.1:5173/callback}
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:http://127.0.0.1:5173/login}

# Usuário administrador padrão, criado por DataSeeder no primeiro boot (só se
# nenhum usuário com login ainda existir). Troque a senha assim que possível.
app.admin.cpf=${APP_ADMIN_CPF:11144477735}
app.admin.senha=${APP_ADMIN_SENHA:Admin@123}
app.admin.nome=${APP_ADMIN_NOME:Administrador}

# Notificações e presença de edição (ver NotificacaoController/DocumentoController)
# ficam em processamento ASSÍNCRONO depois do dispatch inicial (SseEmitter) --
# sem isto, o filtro de autorização do Spring Security roda de novo no
# redispatch assíncrono (quando a conexão SSE fecha/expira), sem
# Authentication disponível naquele momento, e lança AuthorizationDeniedException
# depois que a resposta já foi commitada (os headers do SSE já saíram, gerando
# "Unable to handle the Spring Security Exception because the response is
# already committed" nos logs). A autorização já foi checada no dispatch
# REQUEST inicial; não precisa (nem pode, nesse ponto) ser reavaliada no ASYNC.
spring.security.filter.dispatcher-types=REQUEST,ERROR
# CORS -- origens do navegador autorizadas a chamar a API, separadas por vírgula (SecurityConfig e CorsConfig leem esta lista).
# O padrão é o frontend de desenvolvimento (:5173, outra origem que a API em :8081). Em produção, com tudo atrás do Nginx na
# mesma origem, não há chamada cross-origin: APP_CORS_ALLOWED_ORIGINS vazio.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
