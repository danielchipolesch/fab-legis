name: CI

# Passo mínimo combinado com o usuário (ver docs/testes.md): só o que já rodamos manualmente antes de cada
# tarefa -- testes do backend e do frontend, build do frontend, build estrito dos docs -- mais o lint do frontend
# (eslint-plugin-vue, preset "essential": acha erro real, não estilo) e o SpotBugs no backend (achar bug, não estilo;
# por isso sem Checkstyle). Nada de deploy, matriz de SO/versão ou cobertura ainda -- ver CLAUDE.md.
on:
  push:
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # O PDF é renderizado com a fonte Carlito (fop-config.xml aponta /usr/share/fonts/carlito/...). No Docker ela vem do apk
      # (backend/Dockerfile); o runner do GitHub não a traz, e os testes que geram PDF falhavam com "Failed to read font file".
      - name: Fonte Carlito (usada na geração de PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-crosextra-carlito
          sudo ln -sfn /usr/share/fonts/truetype/crosextra /usr/share/fonts/carlito
          ls /usr/share/fonts/carlito
      - name: Testes unitários (mvn test)
        working-directory: backend
        run: mvn -B test
      # SpotBugs só reporta (goal "spotbugs", não "check"): nunca falha o build, é o passo "acha bug, não bloqueia"
      # combinado com o usuário. O relatório fica disponível como artefato do workflow.
      - name: Análise estática (SpotBugs, não bloqueia)
        working-directory: backend
        run: mvn -B spotbugs:spotbugs
      - name: Relatório do SpotBugs
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint-plugin-vue, preset essential)
        run: npm run lint
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  integracao:
    # Testes de integração (Testcontainers: PostgreSQL de verdade num container) -- o runner do GitHub já traz Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # O PDF é renderizado com a fonte Carlito (fop-config.xml aponta /usr/share/fonts/carlito/...). No Docker ela vem do apk
      # (backend/Dockerfile); o runner do GitHub não a traz, e os testes que geram PDF falhavam com "Failed to read font file".
      - name: Fonte Carlito (usada na geração de PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-crosextra-carlito
          sudo ln -sfn /usr/share/fonts/truetype/crosextra /usr/share/fonts/carlito
          ls /usr/share/fonts/carlito
      - name: Testes de integração (mvn test -DexcludedGroups=nenhum)
        working-directory: backend
        run: mvn -B test -DexcludedGroups=nenhum

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build estrito do MkDocs (mkdocs build --strict)
        run: docker compose build docs
