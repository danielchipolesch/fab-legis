services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fab-legis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-fab-legis-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO — armazenamento de objetos on-premise ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fab-legis-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fab-legis-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fab-legis-dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-fab-legis-imagens}
      MINIO_PUBLIC_URL: http://localhost:9000
      APP_OAUTH2_ISSUER: ${APP_OAUTH2_ISSUER:-http://127.0.0.1:8081}
      APP_OAUTH2_REDIRECT_URI: ${APP_OAUTH2_REDIRECT_URI:-http://127.0.0.1:5173/callback}
      APP_FRONTEND_LOGIN_URL: ${APP_FRONTEND_LOGIN_URL:-http://127.0.0.1:5173/login}
      APP_ADMIN_CPF: ${APP_ADMIN_CPF:-11144477735}
      APP_ADMIN_SENHA: ${APP_ADMIN_SENHA:-Admin@123}
      APP_ADMIN_NOME: ${APP_ADMIN_NOME:-Administrador}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # ── Frontend — desenvolvimento (Vite + HMR) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: fab-legis-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      NODE_ENV: development
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8081/v1}
      VITE_COLLAB_URL: ${VITE_COLLAB_URL:-ws://127.0.0.1:1234}
      # NÃO é VITE_* de propósito -- só o próprio processo do Vite (node, lado
      # servidor) usa isto pra saber pra onde proxiar /oauth2/**, /login,
      # /logout (ver vite.config.js); nunca vai pro bundle do navegador.
      # http://backend:8081 (nome do serviço Docker) porque quem faz essa
      # chamada é o container do frontend, não o navegador do usuário.
      PROXY_BACKEND_TARGET: http://backend:8081
    depends_on:
      - backend
      - collab
    restart: unless-stopped

  # ── Frontend — produção (Nginx, perfil production) ──────────────────────────
  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      # VITE_* é build-time (embutido no JS estático em "npm run build" dentro
      # do Dockerfile, não lido em runtime como o environment: do backend
      # abaixo) -- sem estes args, o build de produção sempre usava o padrão
      # fixo do Dockerfile (http://localhost:8081/v1), ignorando o .env
      # silenciosamente. Lidos do mesmo .env da raiz que o serviço "frontend"
      # de dev já usa (ver docs/instalacao.md, seção "Deploy em produção") --
      # é o único lugar que precisa mudar pra apontar produção pro domínio
      # real; mudar só o .env não move este build já existente, precisa
      # reconstruir a imagem (ver aviso na documentação).
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8081/v1}
        VITE_COLLAB_URL: ${VITE_COLLAB_URL:-ws://127.0.0.1:1234}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    container_name: fab-legis-frontend-prod
    ports:
      - "80:8080"
    environment:
      NODE_ENV: production
    profiles:
      - production
    depends_on:
      - backend
    restart: unless-stopped

  # ── Colaboração em tempo real (Hocuspocus/Yjs) ──────────────────────────────
  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile
    container_name: fab-legis-collab
    ports:
      - "1234:1234"
    environment:
      # ISSUER precisa bater com o claim "iss" do token (o que o NAVEGADOR usa,
      # ver APP_OAUTH2_ISSUER no backend) -- JWKS_URL é só o endereço INTERNO
      # (rede Docker) de onde buscar as chaves públicas, pode ser diferente.
      OAUTH2_ISSUER: ${APP_OAUTH2_ISSUER:-http://127.0.0.1:8081}
      OAUTH2_JWKS_URL: http://backend:8081/oauth2/jwks
      BACKEND_URL: http://backend:8081/v1
    depends_on:
      - backend
    restart: unless-stopped

  # ── Documentação técnica (MkDocs Material, build estático servido por Nginx) ─
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: fab-legis-docs
    ports:
      - "8000:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
