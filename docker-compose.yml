services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: fab-legis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-fab-legis-dev}
    ports:
      - "127.0.0.1:5432:5432"   # só a própria máquina (depuração); nunca exposto à rede
    volumes:
      # PostgreSQL 18+: o volume vai em /var/lib/postgresql (o PGDATA da imagem é /var/lib/postgresql/18/docker), não mais em .../data.
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO — armazenamento de objetos on-premise ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fab-legis-minio
    command: server /data --console-address ":9001"
    ports:
      # O navegador baixa as imagens direto daqui (URLs assinadas, MINIO_PUBLIC_URL): em produção MINIO_BIND=0.0.0.0 (ver README).
      - "${MINIO_BIND:-127.0.0.1}:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Console web (só a própria máquina)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fab-legis-backend
    ports:
      - "127.0.0.1:8081:8081"   # em produção o navegador chega ao backend pelo Nginx (/v1), não por aqui
    environment:
      # Publica a Swagger UI e o JSON do OpenAPI (os endpoints exigem token de qualquer jeito).
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-true}
      # Origens autorizadas a chamar a API pelo navegador (CORS). Em produção, mesma origem via Nginx: vazio.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS-http://127.0.0.1:5173,http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fab-legis-dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-fab-legis-imagens}
      MINIO_PUBLIC_URL: http://localhost:9000
      APP_OAUTH2_ISSUER: ${APP_OAUTH2_ISSUER:-http://127.0.0.1:8081}
      # Chave de assinatura dos tokens: se /app/chaves/jwt-rsa.pem existe (pasta ./segredos/jwt do servidor, montada abaixo), é a chave
      # persistente; senão a chave é efêmera. APP_OAUTH2_CHAVE_OBRIGATORIA=true (produção) faz o boot falhar sem o arquivo.
      APP_OAUTH2_CHAVE_PRIVADA: ${APP_OAUTH2_CHAVE_PRIVADA:-/app/chaves/jwt-rsa.pem}
      APP_OAUTH2_CHAVE_OBRIGATORIA: ${APP_OAUTH2_CHAVE_OBRIGATORIA:-false}
      APP_OAUTH2_REDIRECT_URI: ${APP_OAUTH2_REDIRECT_URI:-http://127.0.0.1:5173/callback}
      APP_FRONTEND_LOGIN_URL: ${APP_FRONTEND_LOGIN_URL:-http://127.0.0.1:5173/login}
      APP_ADMIN_CPF: ${APP_ADMIN_CPF:-11144477735}
      APP_ADMIN_SENHA: ${APP_ADMIN_SENHA:-Admin@123}
      APP_ADMIN_NOME: ${APP_ADMIN_NOME:-DANIEL ANGELO CHIPOLESCH DE ALMEIDA}
      APP_ADMIN_NOME_GUERRA: ${APP_ADMIN_NOME_GUERRA:-CHIPOLESCH}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-chipoleschdaca@fab.mil.br}
      APP_ADMIN_POSTO: ${APP_ADMIN_POSTO:-CP}
      APP_PDF_MAX_CONCORRENTES: ${APP_PDF_MAX_CONCORRENTES:-2}
      APP_PDF_ESPERA_MAXIMA_SEGUNDOS: ${APP_PDF_ESPERA_MAXIMA_SEGUNDOS:-30}
      APP_PDF_CACHE_TTL_DIAS: ${APP_PDF_CACHE_TTL_DIAS:-2}
    volumes:
      # A chave RSA de assinatura dos tokens (jwt-rsa.pem), fornecida pelo ambiente: pasta ./segredos/jwt do servidor (fora do git).
      # Em desenvolvimento fica vazia e a chave é efêmera. Somente leitura: o sistema nunca grava chave nenhuma.
      - ${CHAVES_JWT:-./segredos/jwt}:/app/chaves:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # /actuator/health (Spring Boot Actuator, liberado sem autenticação --
    # ver SecurityConfig) -- antes, o backend não tinha healthcheck nenhum
    # aqui, então frontend/collab/docs só esperavam o container INICIAR, não
    # ficar de fato pronto pra aceitar conexão (ex.: ainda rodando migration
    # do Flyway). wget, não curl: a imagem de runtime é eclipse-temurin
    # jre-alpine, sem curl instalado -- wget já vem no busybox do Alpine.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Frontend — desenvolvimento (Vite + HMR) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    # Só em desenvolvimento (Vite com HMR). O .env de cada ambiente escolhe os perfis: COMPOSE_PROFILES=dev ou production.
    profiles:
      - dev
    container_name: fab-legis-frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      NODE_ENV: development
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8081/v1}
      VITE_COLLAB_URL: ${VITE_COLLAB_URL:-ws://127.0.0.1:1234}
      # NÃO é VITE_* de propósito -- só o próprio processo do Vite (node, lado
      # servidor) usa isto pra saber pra onde proxiar /oauth2/**, /login,
      # /logout (ver vite.config.js); nunca vai pro bundle do navegador.
      # http://backend:8081 (nome do serviço Docker) porque quem faz essa
      # chamada é o container do frontend, não o navegador do usuário.
      PROXY_BACKEND_TARGET: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_started
    restart: unless-stopped

  # ── Frontend — produção (Nginx, perfil production) ──────────────────────────
  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      # VITE_* é build-time (embutido no JS estático em "npm run build" dentro
      # do Dockerfile, não lido em runtime como o environment: do backend
      # abaixo) -- sem estes args, o build de produção sempre usava o padrão
      # fixo do Dockerfile (http://localhost:8081/v1), ignorando o .env
      # silenciosamente. Lidos do mesmo .env da raiz que o serviço "frontend"
      # de dev já usa (ver README.md, seção "Instalação em produção") --
      # é o único lugar que precisa mudar pra apontar produção pro domínio
      # real; mudar só o .env não move este build já existente, precisa
      # reconstruir a imagem (ver aviso na documentação).
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8081/v1}
        VITE_COLLAB_URL: ${VITE_COLLAB_URL:-ws://127.0.0.1:1234}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    container_name: fab-legis-frontend-prod
    ports:
      - "80:8080"
      - "443:8443"   # só responde se o nginx.conf for o de HTTPS (nginx.https.conf.example)
    environment:
      NODE_ENV: production
    volumes:
      # Configuração do Nginx deste ambiente (nginx/nginx.conf, fora do git; copie de nginx/nginx.conf.example). Precisa existir
      # antes do `up`: se não existir, o Docker cria uma PASTA com esse nome e o Nginx não sobe.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/comum.conf:/etc/nginx/comum.conf:ro
      - ./segredos/tls:/etc/nginx/certs:ro   # fullchain.pem e privkey.pem (HTTPS); fora do git
    profiles:
      - production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Colaboração em tempo real (Hocuspocus/Yjs) ──────────────────────────────
  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile
    container_name: fab-legis-collab
    ports:
      - "127.0.0.1:1234:1234"   # em produção o navegador chega ao collab pelo Nginx (/collab)
    environment:
      # ISSUER precisa bater com o claim "iss" do token (o que o NAVEGADOR usa,
      # ver APP_OAUTH2_ISSUER no backend) -- JWKS_URL é só o endereço INTERNO
      # (rede Docker) de onde buscar as chaves públicas, pode ser diferente.
      OAUTH2_ISSUER: ${APP_OAUTH2_ISSUER:-http://127.0.0.1:8081}
      OAUTH2_JWKS_URL: http://backend:8081/oauth2/jwks
      BACKEND_URL: http://backend:8081/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_18_data:
  minio_data:
