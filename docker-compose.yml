services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fab-legis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: fab-legis-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO — armazenamento de objetos on-premise ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fab-legis-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fab-legis-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fab-legis-dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: fab-legis-imagens
      MINIO_PUBLIC_URL: http://localhost:9000
      JWT_SECRET: ${JWT_SECRET:-fab-legis-dev-secret-troque-em-producao-1234567890}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # ── Frontend — desenvolvimento (Vite + HMR) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: fab-legis-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      NODE_ENV: development
      VITE_USE_MOCK_API: "false"
      VITE_API_BASE_URL: "http://127.0.0.1:8081/v1"
      VITE_COLLAB_URL: "ws://127.0.0.1:1234"
    depends_on:
      - backend
      - collab
    restart: unless-stopped

  # ── Frontend — produção (Nginx, perfil production) ──────────────────────────
  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: fab-legis-frontend-prod
    ports:
      - "80:8080"
    environment:
      NODE_ENV: production
    profiles:
      - production
    depends_on:
      - backend
    restart: unless-stopped

  # ── Colaboração em tempo real (Hocuspocus/Yjs) ──────────────────────────────
  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile
    container_name: fab-legis-collab
    ports:
      - "1234:1234"
    environment:
      JWT_SECRET: ${JWT_SECRET:-fab-legis-dev-secret-troque-em-producao-1234567890}
      BACKEND_URL: http://backend:8081/v1
    depends_on:
      - backend
    restart: unless-stopped

  # ── Documentação técnica (MkDocs Material, build estático servido por Nginx) ─
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    container_name: fab-legis-docs
    ports:
      - "8000:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
