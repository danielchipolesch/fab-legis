# Corpo comum dos "server" do Nginx de produção (incluído por nginx.conf e pelo modelo HTTPS): serve a SPA e faz o proxy reverso
# para o backend e o collab. Não tem nada de específico de ambiente -- o que muda (porta, TLS, nome do host) fica no nginx.conf.
root /usr/share/nginx/html;
index index.html;

# ── Compressão ────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

# ── Segurança — cabeçalhos HTTP ───────────────────────────
add_header X-Frame-Options            "SAMEORIGIN"                      always;
add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-XSS-Protection           "1; mode=block"                   always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=()"   always;

# ── Cache — ativos com hash (Vite gera nomes únicos) ─────
location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# ── index.html — nunca cacheado (SPA entry point) ────────
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    add_header Expires       "0";
}

# ── Probe de saúde ────────────────────────────────────────
location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
}

# ── Proxy reverso — mesma origem para o navegador ─────────
# É o equivalente de produção do `server.proxy` do Vite (vite.config.js): /oauth2/**, /login (POST), /logout,
# /.well-known/** e /v1/** parecem, para o navegador, a mesma origem do frontend -- o que faz o cookie de sessão
# (SameSite=Lax) sobreviver ao login OAuth2. Os nomes `backend:8081` e `collab:1234` são os serviços da rede do Compose;
# este arquivo (nginx.conf, fora do git) é por ambiente -- copie de nginx.conf.example e ajuste o que o ambiente exigir.
# O Host NÃO é reescrito: o Spring Security o usa para montar URLs de redirect.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location ~ ^/(oauth2|logout|\.well-known)(/|$) {
    proxy_pass http://backend:8081;
}

location ^~ /v1/ {
    proxy_pass http://backend:8081;
}

# Streams SSE (notificações em tempo real e presença no editor): conexões LONGAS que vão mandando eventos aos poucos. No bloco
# comum acima o Nginx guarda a resposta em buffer e a corta em 60 s sem tráfego -- o navegador não recebia NADA (testado: 0 bytes
# em 8 s pelo Nginx contra o primeiro evento na hora direto no backend). Aqui: HTTP/1.1, sem buffer e com timeout longo.
# Quem declara algum proxy_set_header no bloco não herda os do server: repete os comuns.
location = /v1/notificacoes/stream {
    proxy_pass http://backend:8081;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# A presença tem o id do documento no caminho, então precisa de uma regra por expressão regular -- que o `^~` do bloco /v1/ acima
# impede no nível de cima; por isso fica aninhada num bloco `^~ /v1/documentos/` (que repassa o resto igual ao /v1/).
# O bloco com barra final faz o Nginx REDIRECIONAR (301) `/v1/documentos` para `/v1/documentos/` -- o que quebraria o
# POST de criação --, por isso o caminho exato sem barra tem a sua própria regra.
location = /v1/documentos {
    proxy_pass http://backend:8081;
}

location ^~ /v1/documentos/ {
    proxy_pass http://backend:8081;

    location ~ ^/v1/documentos/[0-9]+/presenca/stream$ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Swagger UI: o contrato da API para quem vai consumi-la. Os endpoints seguem exigindo token (o Swagger só descreve);
# APP_SWAGGER_ENABLED=false no backend desliga a UI e o JSON (o /v1/fab-legis-api do bloco acima). `^~` e `=` para não
# caírem no bloco de cache de .js/.css, que serviria 404 para os assets do Swagger.
location ^~ /swagger-ui/ {
    proxy_pass http://backend:8081;
}

location = /swagger-ui.html {
    proxy_pass http://backend:8081;
}

# GET /login é a tela de login da SPA (Vue Router); só o POST é do backend. O 418 é o truque usual do nginx para
# decidir por método: o POST cai no @backend, o resto serve a SPA.
location = /login {
    error_page 418 = @backend;
    if ($request_method = POST) { return 418; }
    try_files /index.html =404;
}

location @backend {
    proxy_pass http://backend:8081;
}

# Colaboração em tempo real (Hocuspocus/Yjs): WebSocket em /collab. A barra final tira o prefixo antes de repassar.
location ^~ /collab/ {
    proxy_pass http://collab:1234/;
    proxy_http_version 1.1;
    # Quem declara algum proxy_set_header no bloco não herda os do server: repete os comuns.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── SPA — redireciona tudo para index.html ────────────────
location / {
    try_files $uri $uri/ /index.html;
}

server_tokens off;
client_max_body_size 10m;
