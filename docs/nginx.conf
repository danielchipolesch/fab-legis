server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Segurança — cabeçalhos HTTP ───────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # ── Cache — assets versionados pelo MkDocs (hash no nome, em /assets/) ─
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── stylesheets/js próprios (docs/stylesheets/extra.css etc.) — sem
    # hash no nome, então nunca "immutable": o navegador deve revalidar a
    # cada carregamento, senão uma alteração não aparece até o cache expirar.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Probe de saúde ────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── MkDocs gera páginas como diretórios com index.html ────
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    server_tokens off;
}
